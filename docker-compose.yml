services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      VISIONOPS_DATABASE_URL: sqlite:////data/visionops.db
      VISIONOPS_UPLOAD_DIR: /data/uploads
      VISIONOPS_OUTPUT_DIR: /data/outputs
      VISIONOPS_MODEL_PATH: /models/VisionOps_best.pt
    volumes:
      - ./VisionOps_best.pt:/models/VisionOps_best.pt:ro
      - visionops-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  visionops-data:

